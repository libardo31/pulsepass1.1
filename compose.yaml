services:
  postgres:
    image: postgres:17-alpine
    container_name: pulsepass-postgres
    environment:
      POSTGRES_DB: pulsepass
      POSTGRES_USER: pulsepass
      POSTGRES_PASSWORD: pulsepass
    ports:
      - "5432:5432"
    volumes:
      - pulsepass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsepass -d pulsepass"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pulsepass-postgres-data:
